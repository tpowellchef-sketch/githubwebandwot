<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AND WOT | Home</title>

  <style>
    /* ========================================
       COLOUR PALETTE
       ======================================== */
    :root {
      --black: #000000;
      --white: #ffffff;
      --grey: #808080;
      --green-accent: #2e8b57;
      --green-hover: #00ff66;
    }

    /* ========================================
       RESET
       ======================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    /* ========================================
       BODY
       ======================================== */
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--black);
    }

    body {
      min-height: 100vh;
    }

    /* ========================================
       CRT SCANLINE OVERLAY
       ======================================== */
    body::after {
      content: "";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;

      background:
        linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.4) 50%
        ),
        linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.03),
          rgba(0, 255, 0, 0.01),
          rgba(0, 0, 255, 0.03)
        );

      background-size: 100% 3px, 6px 100%;
      z-index: 99;
      pointer-events: none;
    }

    /* ========================================
       GLITCH CONTAINER
       ======================================== */
    .glitch-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    /* ========================================
       MAIN IMAGE
       ======================================== */
    .glitch-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      background-image: url('images/homeimg.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }

    /* ========================================
       MAIN GLITCH
       SLOWER + MORE OCCASIONAL
       ======================================== */
    .glitch-main {
      animation: heavy-glitch-jump 7s infinite steps(1);
    }

    /* ========================================
       PINK / RED GLITCH LAYER
       ======================================== */
    .glitch-layer-1 {
      opacity: 0.8;
      mix-blend-mode: screen;

      filter:
        drop-shadow(0 0 10px #ff0055)
        hue-rotate(290deg)
        saturate(300%);

      animation:
        glitch-slice-1 4s infinite linear alternate-reverse,
        strobe-flash 8s infinite;
    }

    /* ========================================
       CYAN / BLUE GLITCH LAYER
       ======================================== */
    .glitch-layer-2 {
      opacity: 0.8;
      mix-blend-mode: screen;

      filter:
        drop-shadow(0 0 10px #00f0ff)
        hue-rotate(180deg)
        saturate(300%);

      animation:
        glitch-slice-2 3.5s infinite linear alternate-reverse;
    }

    /* ========================================
       ACID GREEN GLITCH LAYER
       ======================================== */
    .glitch-layer-3 {
      opacity: 0.6;
      mix-blend-mode: color-dodge;

      filter:
        drop-shadow(0 0 15px #00ff66)
        hue-rotate(90deg)
        contrast(200%);

      animation:
        glitch-slice-3 5s infinite linear alternate-reverse;
    }

    /* ========================================
       MAIN VIOLENT GLITCH
       ONLY HAPPENS OCCASIONALLY
       ======================================== */
    @keyframes heavy-glitch-jump {

      0%,
      94%,
      100% {
        transform: translate(0, 0) scale(1);
        filter: none;
      }

      95% {
        transform:
          translate(-8px, 4px)
          scale(1.02)
          skewX(3deg);

        filter: invert(0.9);
      }

      96% {
        transform:
          translate(12px, -6px)
          scale(0.98);

        filter: contrast(300%);
      }

      97% {
        transform:
          translate(-15px, -3px)
          skewY(-2deg);

        filter: hue-rotate(180deg);
      }

      98% {
        transform:
          translate(5px, 8px)
          scale(1.01);

        filter: none;
      }

      99% {
        transform: translate(0, 0);
        filter: none;
      }
    }

    /* ========================================
       PINK SLICE ANIMATION
       ======================================== */
    @keyframes glitch-slice-1 {

      0% {
        clip-path: inset(15% 0 70% 0);
        transform: translate(-12px, 2px);
      }

      15% {
        clip-path: inset(55% 0 10% 0);
        transform: translate(10px, -4px);
      }

      30% {
        clip-path: inset(80% 0 5% 0);
        transform: translate(-6px, 6px);
      }

      45% {
        clip-path: inset(35% 0 45% 0);
        transform: translate(14px, -2px);
      }

      60% {
        clip-path: inset(5% 0 85% 0);
        transform: translate(-8px, 3px);
      }

      75% {
        clip-path: inset(70% 0 20% 0);
        transform: translate(12px, -5px);
      }

      90% {
        clip-path: inset(25% 0 50% 0);
        transform: translate(-4px, 1px);
      }

      100% {
        clip-path: inset(40% 0 40% 0);
        transform: translate(6px, -3px);
      }
    }

    /* ========================================
       CYAN SLICE ANIMATION
       ======================================== */
    @keyframes glitch-slice-2 {

      0% {
        clip-path: inset(80% 0 5% 0);
        transform: translate(10px, -2px);
      }

      20% {
        clip-path: inset(10% 0 65% 0);
        transform: translate(-12px, 5px);
      }

      40% {
        clip-path: inset(45% 0 35% 0);
        transform: translate(8px, -6px);
      }

      60% {
        clip-path: inset(25% 0 60% 0);
        transform: translate(-10px, 3px);
      }

      80% {
        clip-path: inset(65% 0 15% 0);
        transform: translate(14px, -1px);
      }

      100% {
        clip-path: inset(5% 0 80% 0);
        transform: translate(-6px, 4px);
      }
    }

    /* ========================================
       GREEN SLICE ANIMATION
       ======================================== */
    @keyframes glitch-slice-3 {

      0% {
        clip-path: inset(30% 0 60% 0);
        transform: translate(-5px, 10px);
      }

      25% {
        clip-path: inset(75% 0 15% 0);
        transform: translate(8px, -10px);
      }

      50% {
        clip-path: inset(10% 0 80% 0);
        transform: translate(-15px, 2px);
      }

      75% {
        clip-path: inset(50% 0 30% 0);
        transform: translate(5px, 8px);
      }

      100% {
        clip-path: inset(5% 0 90% 0);
        transform: translate(-8px, -4px);
      }
    }

    /* ========================================
       SLOWER STROBE
       ======================================== */
    @keyframes strobe-flash {

      0%,
      94%,
      96%,
      100% {
        opacity: 0.8;
      }

      95% {
        opacity: 0.1;
      }

      97% {
        opacity: 1;
        filter: brightness(250%);
      }
    }

    /* ========================================
       HEADER
       ======================================== */
    header {
      width: 100%;
      padding: 1.5rem 2rem;

      display: flex;
      justify-content: flex-end;

      position: absolute;
      top: 0;
      right: 0;

      z-index: 1000;
    }

    /* ========================================
       NAVIGATION
       ======================================== */
    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.5rem;

      background: rgba(0, 0, 0, 0.85);

      padding: 0.8rem 1.5rem;

      border-radius: 4px;
      border: 1px solid var(--green-accent);

      box-shadow:
        0 0 15px rgba(46, 139, 87, 0.4);
    }

    .nav-links a {
      color: var(--white);

      text-decoration: none;

      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 1px;

      transition:
        color 0.3s,
        text-shadow 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--green-hover);

      text-shadow:
        0 0 8px var(--green-hover);
    }

    /* ========================================
       EVENT COUNTDOWN
       ======================================== */
    .countdown {
      position: fixed;

      bottom: 25px;
      right: 25px;

      z-index: 1000;

      background: rgba(0, 0, 0, 0.85);

      border: 1px solid var(--green-accent);
      border-radius: 4px;

      padding: 15px 20px;

      color: var(--white);
      text-align: center;

      backdrop-filter: blur(5px);

      box-shadow:
        0 0 15px rgba(0, 0, 0, 0.9);
    }

    .countdown-title {
      font-size: 0.7rem;

      letter-spacing: 2px;

      color: var(--green-hover);

      margin-bottom: 10px;

      font-weight: 600;

      text-shadow:
        0 0 5px var(--green-hover);
    }

    .countdown-time {
      display: flex;

      justify-content: center;

      gap: 15px;
    }

    .countdown-time div {
      min-width: 40px;
    }

    .countdown-time span {
      display: block;

      font-size: 1.5rem;

      font-weight: 700;

      line-height: 1;
    }

    .countdown-time small {
      display: block;

      font-size: 0.55rem;

      color: var(--grey);

      margin-top: 5px;

      letter-spacing: 1px;
    }

    .countdown-date {
      margin-top: 10px;

      font-size: 0.65rem;

      letter-spacing: 3px;

      color: var(--grey);
    }

    /* ========================================
       MOBILE
       ======================================== */
    @media (max-width: 600px) {

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
      }

      .glitch-wrapper {
        width: 100%;
        height: 100dvh;
      }

      /*
        IMPORTANT:
        On phones we use CONTAIN instead of COVER.
        This prevents the sides of the artwork,
        including the full AND WOT logo, being cropped.
      */
      .glitch-img {
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;
        background-color: #000;
      }

      /* Slightly calmer mobile glitch */
      .glitch-main {
        animation: heavy-glitch-jump 8s infinite steps(1);
      }

      .glitch-layer-1 {
        animation:
          glitch-slice-1 5s infinite linear alternate-reverse,
          strobe-flash 10s infinite;
      }

      .glitch-layer-2 {
        animation:
          glitch-slice-2 4.5s infinite linear alternate-reverse;
      }

      .glitch-layer-3 {
        animation:
          glitch-slice-3 6s infinite linear alternate-reverse;
      }

      /* Navigation */
      header {
        justify-content: center;
        padding: 1rem;
      }

      .nav-links {
        gap: 0.8rem;
        padding: 0.6rem 1rem;
      }

      .nav-links a {
        font-size: 0.75rem;
      }

      /* Countdown */
      .countdown {
        bottom: 15px;
        right: 15px;

        padding: 12px 15px;
      }

      .countdown-time {
        gap: 8px;
      }

      .countdown-time span {
        font-size: 1.2rem;
      }

      .countdown-title {
        font-size: 0.6rem;
      }

      .countdown-date {
        font-size: 0.55rem;
      }
    }

    /* ========================================
       VERY SMALL PHONES
       ======================================== */
    @media (max-width: 380px) {

      .nav-links {
        gap: 0.5rem;
        padding: 0.55rem 0.7rem;
      }

      .nav-links a {
        font-size: 0.65rem;
        letter-spacing: 0.5px;
      }

      .countdown {
        right: 10px;
        bottom: 10px;

        padding: 10px 12px;
      }

      .countdown-time {
        gap: 5px;
      }

      .countdown-time div {
        min-width: 32px;
      }

      .countdown-time span {
        font-size: 1rem;
      }
    }
  </style>

</head>
