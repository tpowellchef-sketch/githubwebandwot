<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AND WOT | Home</title>

  <style>
    /* ========================================
       COLOUR PALETTE
       ======================================== */
    :root {
      --black: #000000;
      --white: #ffffff;
      --grey: #808080;
      --green-accent: #2e8b57;
      --green-hover: #3cb371;
    }


    /* ========================================
       RESET
       ======================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }


    /* ========================================
       BODY
       ======================================== */
    body {
      background: url('images/homeimg.png') no-repeat center center fixed;
      background-size: cover;

      min-height: 100vh;
      width: 100vw;

      overflow: hidden;
    }


    /* ========================================
       HEADER
       ======================================== */
    header {
      width: 100%;

      padding: 1.5rem 2rem;

      display: flex;
      justify-content: flex-end;

      position: absolute;
      top: 0;
      right: 0;

      z-index: 1000;
    }


    /* ========================================
       NAVIGATION
       ======================================== */
    .nav-links {
      display: flex;

      list-style: none;

      gap: 1.5rem;

      background: rgba(0, 0, 0, 0.85);

      padding: 0.8rem 1.5rem;

      border-radius: 4px;

      border: 1px solid var(--green-accent);
    }


    .nav-links a {
      color: var(--white);

      text-decoration: none;

      font-weight: 600;

      text-transform: uppercase;

      font-size: 0.9rem;

      letter-spacing: 1px;

      transition: color 0.3s;
    }


    .nav-links a:hover,
    .nav-links a.active {
      color: var(--green-hover);
    }


    /* ========================================
       EVENT COUNTDOWN
       ======================================== */
    .countdown {
      position: fixed;

      bottom: 25px;
      right: 25px;

      z-index: 1000;

      background: rgba(0, 0, 0, 0.85);

      border: 1px solid var(--green-accent);

      border-radius: 4px;

      padding: 15px 20px;

      color: var(--white);

      text-align: center;

      backdrop-filter: blur(5px);
    }


    /* Countdown title */
    .countdown-title {
      font-size: 0.7rem;

      letter-spacing: 2px;

      color: var(--green-hover);

      margin-bottom: 10px;

      font-weight: 600;
    }


    /* Numbers container */
    .countdown-time {
      display: flex;

      justify-content: center;

      gap: 15px;
    }


    /* Individual number */
    .countdown-time div {
      min-width: 40px;
    }


    .countdown-time span {
      display: block;

      font-size: 1.5rem;

      font-weight: 700;

      line-height: 1;
    }


    /* Labels */
    .countdown-time small {
      display: block;

      font-size: 0.55rem;

      color: var(--grey);

      margin-top: 5px;

      letter-spacing: 1px;
    }


    /* Event date */
    .countdown-date {
      margin-top: 10px;

      font-size: 0.65rem;

      letter-spacing: 3px;

      color: var(--grey);
    }


    /* ========================================
       MOBILE
       ======================================== */
    @media (max-width: 600px) {

      header {
        justify-content: center;

        padding: 1rem;
      }


      .nav-links {
        gap: 0.8rem;

        padding: 0.6rem 1rem;
      }


      .nav-links a {
        font-size: 0.75rem;
      }


      .countdown {
        bottom: 15px;

        right: 15px;

        padding: 12px 15px;
      }


      .countdown-time {
        gap: 8px;
      }


      .countdown-time span {
        font-size: 1.2rem;
      }

    }

  </style>
</head>


<body>


  <!-- ========================================
       TOP-RIGHT NAVIGATION
       ======================================== -->

  <header>

    <nav>

      <ul class="nav-links">

        <li>
          <a href="index.html" class="active">
            Home
          </a>
        </li>

        <li>
          <a href="about.html">
            About
          </a>
        </li>

        <li>
          <a href="rigging.html">
            Rigging
          </a>
        </li>

        <li>
          <a href="contact.html">
            Contact Us
          </a>
        </li>

      </ul>

    </nav>

  </header>



  <!-- ========================================
       EVENT COUNTDOWN
       ======================================== -->

  <div class="countdown">

    <div class="countdown-title">
      NEXT EVENT — ONYX
    </div>


    <div class="countdown-time">

      <div>
        <span id="days">00</span>
        <small>DAYS</small>
      </div>


      <div>
        <span id="hours">00</span>
        <small>HRS</small>
      </div>


      <div>
        <span id="minutes">00</span>
        <small>MIN</small>
      </div>


      <div>
        <span id="seconds">00</span>
        <small>SEC</small>
      </div>

    </div>


    <div class="countdown-date">
      17.10.2026
    </div>

  </div>



  <!-- ========================================
       COUNTDOWN JAVASCRIPT
       ======================================== -->

  <script src="countdown.js"></script>


</body>
</html>
